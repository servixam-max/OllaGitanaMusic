name: olla_gitana_music
description: "App móvil para el grupo musical Olla Gitana - Mezclador de stems, letras, acordes y repertorio"
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  dio: ^5.4.1
  web_socket_channel: ^2.4.5
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
