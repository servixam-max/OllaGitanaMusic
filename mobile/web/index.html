<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App oficial Olla Gitana Music para ensayo y directos">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Olla Gitana">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Olla Gitana Music</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      background-color: #121214;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #E5A93C;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(229, 169, 60, 0.2);
      border-top-color: #E5A93C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top: 18px; font-weight: bold; letter-spacing: 2px; font-size: 15px;">OLLA GITANA MUSIC</p>
    <p style="margin-top: 4px; color: #8A8A93; font-size: 12px;">Cargando sala de ensayo...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
