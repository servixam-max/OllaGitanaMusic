name: Build & Release Android APK & Web PWA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias de test (sin torch/demucs para rapidez)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings sqlalchemy aiosqlite greenlet httpx python-multipart aiofiles websockets pytest pytest-asyncio

      - name: Ejecutar tests
        run: |
          cd backend
          python -m pytest tests/ -q

  build:
    name: Compilar APK Android y Web PWA
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Analizar código Flutter
        run: |
          cd mobile
          flutter analyze

      - name: Decodificar keystore de release (si existe el secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd mobile/android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > olla-gitana-key.jks
            cat > ../key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
            echo "Keystore de release configurado desde secrets"
          else
            echo "::warning::Sin secret KEYSTORE_BASE64 — el APK se firmará con la clave de debug"
          fi

      - name: Compilar APK Release
        run: |
          cd mobile
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: ([0-9.]+).*/\1/')
          flutter build apk --release --dart-define=APP_VERSION=v$VERSION

      - name: Compilar Web PWA Release
        run: |
          cd mobile
          flutter build web --release --base-href "/olla/app/"

      - name: Empaquetar Web PWA
        run: |
          cd mobile/build/web
          tar -czvf ../../../olla-gitana-web.tar.gz .

      - name: Renombrar APK
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk olla-gitana-music.apk

      - name: Subir artefactos de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            olla-gitana-music.apk
            olla-gitana-web.tar.gz

      - name: Publicar Release en GitHub con APK y Web PWA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Olla Gitana Music ${{ github.ref_name }}"
          files: |
            olla-gitana-music.apk
            olla-gitana-web.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
