name: Build & Release Android APK & Web PWA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android y Web PWA
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Compilar APK Release
        run: |
          cd mobile
          flutter build apk --release

      - name: Compilar Web PWA Release
        run: |
          cd mobile
          flutter build web --release --base-href "/olla/app/"

      - name: Empaquetar Web PWA
        run: |
          cd mobile/build/web
          tar -czvf ../../../olla-gitana-web.tar.gz .

      - name: Renombrar APK
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk olla-gitana-music.apk

      - name: Subir artefactos de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            olla-gitana-music.apk
            olla-gitana-web.tar.gz

      - name: Publicar Release en GitHub con APK y Web PWA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Olla Gitana Music ${{ github.ref_name }}"
          files: |
            olla-gitana-music.apk
            olla-gitana-web.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
