version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olla_gitana_backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite+aiosqlite:////app/data/olla_gitana.db
      - API_TOKEN=${API_TOKEN:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
